<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Contact</title>

</head>

<body>

<header>

<h1>Contact Me</h1>

</header>

<main>

<form>

<label for="name">Name</label>

<input
type="text"
id="name"
required>

<label for="email">Email</label>

<input
type="email"
id="email"
required
aria-label="Email Address">

<label for="message">Message</label>

<textarea
id="message"
rows="5"
required></textarea>

<button type="submit">
Send Message
</button>

</form>

</main>

<footer>

<p>© 2026 Lasya Priya</p>

</footer>

</body>

</html>
